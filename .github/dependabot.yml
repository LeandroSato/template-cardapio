# Abre PRs de atualização sozinho; o CI roda em cada um e você decide o merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      atualizacoes-menores:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    ignore:
      # @astrojs/check ainda só aceita TypeScript 5 ou 6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Astro 7.4+ exige Node 22.23; voltar a aceitar quando o Node local for atualizado.
      - dependency-name: astro
        versions: [">=7.4.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
