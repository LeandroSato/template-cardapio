name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checagens:
    name: checagens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (astro check)
        run: npm run check

      - name: Código morto (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hoje há falhas conhecidas no Astro 6 e no sharp que pedem upgrade de versão maior.
      # Enquanto isso, o audit só avisa. Depois do upgrade, remover o continue-on-error.
      - name: Dependências vulneráveis (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high
