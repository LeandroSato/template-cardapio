name: Conserto automático

# Quando o CI ou a Rotina falham, o Claude lê o log, corrige e explica.
# - Falha numa branch de PR: o conserto entra na própria branch (o PR é atualizado e o CI roda de novo).
# - Falha na main (rotina ou depois de um merge): o conserto vai para uma branch claude/conserto-*
#   e o Claude deixa na issue o link para você abrir o PR.
# Tenta até 3 vezes por branch (cada tentativa é um commit "conserto automático: ..."); se o CI
# continuar falhando, para, marca o PR com "segurar" e pede ajuda no PR.
# O merge de quem passa no CI é feito pela "Esteira de PRs".
on:
  workflow_run:
    workflows: [CI, Rotina]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: conserto-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  consertar:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      MAX_TENTATIVAS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Contar tentativas
        id: tentativas
        run: |
          git fetch -q origin main
          n=$(git log origin/main..HEAD --format=%s | grep -c '^conserto automático' || true)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Tentativas anteriores nesta branch: $n de $MAX_TENTATIVAS"

      - name: Pedir ajuda depois do limite
        if: fromJSON(steps.tentativas.outputs.n) >= 3
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ github.event.workflow_run.html_url }}
        run: |
          gh label create segurar --color 5319E7 --description "A esteira não faz merge" --force
          gh pr edit "$BRANCH" --add-label segurar
          gh pr comment "$BRANCH" --body "Tentei consertar $MAX_TENTATIVAS vezes e o CI continua falhando ($LINK). Parei e marquei com \`segurar\`. Preciso de você aqui; quando resolver, tire o rótulo."

      - uses: actions/setup-node@v7
        if: fromJSON(steps.tentativas.outputs.n) < 3
        with:
          node-version-file: package.json
          cache: npm

      - name: Instalar dependências
        if: fromJSON(steps.tentativas.outputs.n) < 3
        run: npm ci

      - name: Instalar navegador do Playwright
        if: fromJSON(steps.tentativas.outputs.n) < 3
        run: npx playwright install --with-deps chromium

      - name: Claude conserta
        if: fromJSON(steps.tentativas.outputs.n) < 3
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run:*),Bash(npx:*),Bash(git:*),Bash(gh run view:*),Bash(gh pr comment:*),Bash(gh issue:*),Bash(date:*)"
          prompt: |
            Você é o agente de conserto automático deste repositório. Uma checagem falhou.
            - Workflow: ${{ github.event.workflow_run.name }}
            - Execução: ${{ github.event.workflow_run.html_url }} (id ${{ github.event.workflow_run.id }})
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Tentativas anteriores nesta branch: ${{ steps.tentativas.outputs.n }} de 3. Se já houve, leia os
              commits "conserto automático" desta branch e tente outro caminho, não o mesmo.

            1. Leia o log da falha: `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
            2. Descubra a causa. Se NÃO for problema de código (site fora do ar, Cloudflare, rede,
               instabilidade do GitHub ou do npm), não mude nada: só explique no passo 6 e pare.
            3. Corrija a causa com a menor mudança possível, seguindo o CLAUDE.md do repositório se existir.
               Nunca apague, pule ou afrouxe um teste para ele passar. Nunca altere nada em `.github/`.
            4. Confirme rodando: `npm run check`, `npm run knip`, `npm run build`, `npm run test:e2e`.
            5. Faça commit com mensagem começando por "conserto automático:" (português, objetivo).
               - Branch diferente de main: dê push nela mesma.
               - Branch main: crie `claude/conserto-AAAA-MM-DD` e dê push nela. Nunca dê push na main.
            6. Explique em até 6 linhas, como quem conversa com um colega: o que quebrou, por quê,
               o que mudou e como testou (ou por que não mexeu em nada).
               - Branch de PR: `gh pr comment ${{ github.event.workflow_run.head_branch }} --body "..."`.
               - Main: comente na issue aberta com o rótulo "rotina" (`gh issue list --label rotina`)
                 ou crie uma com esse rótulo, e inclua o link para abrir o PR:
                 https://github.com/${{ github.repository }}/compare/main...claude/conserto-AAAA-MM-DD?expand=1
